<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="goldDelta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#3b5079" stroke-width="4" />

  <!-- Outer orbital ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#glowRing)" stroke-width="6" stroke-dasharray="8 6" opacity="0.7" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#6366f1" stroke-width="8" opacity="0.9" />

  <!-- Socratic Prism Delta -->
  <polygon points="256,150 160,345 352,345" fill="none" stroke="url(#goldDelta)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Core rational beacon -->
  <circle cx="256" cy="265" r="28" fill="#3b82f6" stroke="#ffffff" stroke-width="5" />
</svg>
